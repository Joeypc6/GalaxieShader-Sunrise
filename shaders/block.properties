# Galaxie: block ids (mc_Entity.x), as the WGSL pack's [[materials]] and [[lights]] named sprites and blocks.
# One id per block; a light source also has its light's colour (lib/material.glsl, gs_source_color).

# Water and lava.
block.1=water
block.2=lava

# Leaves: sway, let sunlight through.
block.10=oak_leaves spruce_leaves birch_leaves jungle_leaves acacia_leaves dark_oak_leaves mangrove_leaves \
 cherry_leaves azalea_leaves flowering_azalea_leaves pale_oak_leaves

# Grass, flowers, crops: bend in the wind. Only plants one block tall and the top halves of two-block
# plants: each block bends on its own, so a plant stacked from several blocks would tear apart.
block.11=short_grass tall_grass:half=upper fern large_fern:half=upper dead_bush short_dry_grass tall_dry_grass \
 bush firefly_bush dandelion poppy blue_orchid allium azure_bluet red_tulip orange_tulip white_tulip pink_tulip \
 oxeye_daisy cornflower lily_of_the_valley torchflower lilac:half=upper rose_bush:half=upper peony:half=upper \
 oak_sapling spruce_sapling birch_sapling jungle_sapling acacia_sapling dark_oak_sapling cherry_sapling \
 pale_oak_sapling wheat carrots potatoes beetroots sweet_berry_bush

# Water plants: sway with the water.
block.12=seagrass tall_seagrass:half=upper

# Snow glitters toward the sun; ice is smooth.
block.13=snow snow_block powder_snow
block.14=ice packed_ice blue_ice

