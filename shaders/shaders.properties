# Hipped's Galaxie Shader, in the shaders/ format. By Joeypc6 and HippedPainter68, PolyForm Shield 1.0.0 + Sunrise Additional Terms 1.0 (LICENSE.txt);
# ported to the shaders/ format by Joeypc6 from the tuned Sunrise WGSL pack.

# The pack draws its own sky, sun, moon (by phase), stars and clouds (deferred); vanilla's stay off.
sky=false
sun=false
moon=false
stars=false
clouds=off

# The pack's pictures, linear and (see their .mcmeta) clamped or repeating, in every program.
customTexture.night_sky=textures/night_sky.png
customTexture.sky_bodies=textures/sky_bodies.png
customTexture.planet_maps=textures/planet_maps.png
customTexture.cloud_noise=textures/cloud_noise.png
customTexture.cloud_shape=textures/cloud_shape.png
customTexture.cloud_detail=textures/cloud_detail.png

# Bloom and light shafts at half size, the rain clock at a quarter (the WGSL passes' scale).
size.buffer.colortex3=0.5 0.5
size.buffer.colortex7=0.5 0.5
size.buffer.colortex5=0.25 0.25
size.buffer.colortex6=0.25 0.25

# Translucent terrain overwrites the surface data (glass and water are not wet ground), and the hand,
# entities and block entities write theirs whole.
blend.gbuffers_water.colortex2=off
blend.gbuffers_hand.colortex2=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_block.colortex2=off

# The shadow pass only with the Shadows option.
program.shadow.enabled=SHADOWS

# Particles after deferred: they draw over the pack's sky.
particles.before.deferred=false

screen=[LIGHTING] [SKY] [WEATHER] [WATER] [PICTURE] [CAMERA]
screen.LIGHTING=SHADOWS COLORED_LIGHT BLOCK_LIGHT_HUE RAY_STRENGTH BLOOM_STRENGTH FOG_AMOUNT
screen.SKY=VOLUMETRIC_CLOUDS CLOUD_AMOUNT CLOUD_QUALITY GALAXY_BRIGHTNESS STAR_DENSITY AURORA DAY_BLUE
screen.WEATHER=WETNESS_AMOUNT PUDDLE_DRYING STORM_FLASHES WIND_STRENGTH
screen.WATER=WATER_MIRROR WAVE_HEIGHT WAVE_SPEED
screen.PICTURE=EXPOSURE AUTO_EXPOSURE SATURATION FXAA
screen.CAMERA=DEPTH_OF_FIELD MOTION_BLUR CHROMATIC_ABERRATION VIGNETTE
screen.columns=2
sliders=COLORED_LIGHT RAY_STRENGTH BLOOM_STRENGTH FOG_AMOUNT CLOUD_AMOUNT WETNESS_AMOUNT PUDDLE_DRYING STORM_FLASHES WIND_STRENGTH WAVE_HEIGHT WAVE_SPEED GALAXY_BRIGHTNESS STAR_DENSITY AURORA DAY_BLUE EXPOSURE SATURATION DEPTH_OF_FIELD MOTION_BLUR CHROMATIC_ABERRATION CLOUD_QUALITY
